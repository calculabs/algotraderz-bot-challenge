name = "algotraderz-bot"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Roster storage — one KV namespace. Create it once, then paste the id here:
#   npx wrangler kv namespace create ROSTER
kv_namespaces = [
  { binding = "ROSTER", id = "d620173d38e64bb9be2ce4a0643f747d" }
]

[vars]
# Your Discord application's PUBLIC KEY (Dev Portal → General Information). Not a
# secret — it only verifies inbound request signatures.
DISCORD_PUBLIC_KEY = "dc720a3c014be705579bfea87a40a5408a95bccb799a3b0b916aa6bcf9768083"

# Where /leaderboard points.
SITE_URL = "https://calculabs.github.io/algotraderz-bot-challenge/"

# Comma-separated Discord user ids allowed to run /remove (e.g. "111,222").
# Turn on Discord Developer Mode, right-click yourself → Copy User ID.
ADMIN_IDS = "512516249507463169, 813975359485116456"

# Mid-week, account SWAPS are always locked. Brand-new late joins stay open by default
# (friendly). Set this to "true" to also close new joins during the live week.
LOCK_JOIN = "false"

# Channel for the weekly champion announcement. Right-click the channel → Copy
# Channel ID. Leave blank to disable announcements. The bot needs "Send Messages"
# in this channel, and DISCORD_BOT_TOKEN must be set as a secret (see below).
ANNOUNCE_CHANNEL_ID = "1515193707228434675"

# One cron drives both jobs; each self-gates on the CME calendar phase and on a per-week KV
# marker, so firing constantly is free (2 KV reads a fire at steady state) and the schedule
# carries no logic of its own:
#
#   champion post    once the week is "done" (after Friday's CME close)
#   rollover sweep   any fire after Sunday's 1pm PT rollover — deletes last week's keys and
#                    posts the "new week" notice. Idempotent: it can run late or twice.
#
# Every 10 min rather than hourly so the sweep and notice normally land within minutes of the
# rollover, while traders are waiting for the open. It is NOT load-bearing that a fire lands
# in the pre-open window: entries are dated, and the bot treats last week's as gone from the
# rollover on regardless of when the sweep runs. (The 2026-08-16 rollover was missed under
# the old design, where one clean fire in that window was the only thing that cleared the
# board — the roster carried into the live week and got stuck behind the swap lock.)
#
# Do NOT narrow this to Sundays with a day-of-week field: Cloudflare's cron parser takes
# 1-7 or SUN-SAT there, so the obvious "*/10 * * * 0" is a 400 and the whole schedules
# update fails — leaving fresh code deployed with no triggers behind it.
[triggers]
crons = ["*/10 * * * *"]

# Workers Logs (free tier: 200k events/day, a few days' retention). The bot console.logs
# what each cron fire did — phase, how many entries the sweep dropped, whether the notice or
# champion post went out and why not — so a missed rollover can be read off the dashboard
# (Worker → Logs) instead of reconstructed from the roster after the fact.
[observability]
enabled = true

# Secrets are NOT stored here — set the bot token once with:
#   npx wrangler secret put DISCORD_BOT_TOKEN
# Needed only for the announcement POST (and by register.js, run locally). Interaction
# replies verify with DISCORD_PUBLIC_KEY above and never touch the token.
