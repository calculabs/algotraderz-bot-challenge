name: Roster sync

# When someone submits (or edits) a "roster" issue, apply it to participants.json
# and trigger a redeploy. Fully self-serve — no maintainer action required.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    if: contains(github.event.issue.labels.*.name, 'roster')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/apply-roster-issue.mjs

      - name: Commit roster change
        if: steps.apply.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add participants.json
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "roster: update from #${{ github.event.issue.number }}"
            git push
          fi

      - uses: actions/github-script@v7
        env:
          OK: ${{ steps.apply.outputs.ok }}
          MSG: ${{ steps.apply.outputs.message }}
        with:
          script: |
            const ok = process.env.OK === "true";
            const msg = process.env.MSG || "";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: ok
                ? `✅ ${msg}\n\nThe leaderboard will refresh shortly: https://calculabs.github.io/algotraderz-bot-challenge/`
                : `⚠️ ${msg}\n\nEdit this issue with a valid share link and it'll retry automatically.`
            });
            if (ok) {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: "leaderboard.yml", ref: "main" });
              await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });
            }
