<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly Bot Challenge · Standings</title>
  <style>
    :root {
      --bg-0: #060a14;
      --bg-1: #0a1122;
      --card: rgba(255, 255, 255, 0.028);
      --card-border: rgba(255, 255, 255, 0.07);
      --ink: #eef2f8;
      --muted: #6f8097;
      --muted-dim: #47566b;
      --green: #34d399;
      --red: #f77066;
      --gold: #f4c04f;
      --silver: #c3ccda;
      --bronze: #d6884a;
      --blue: #7fa9ff;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background:
        radial-gradient(120% 60% at 50% -8%, rgba(94, 132, 214, 0.20), transparent 60%),
        radial-gradient(80% 40% at 50% 0%, rgba(150, 180, 255, 0.10), transparent 55%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 40%);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto 0;
      height: 70vh;
      background:
        conic-gradient(from 175deg at 50% -10%,
          transparent 0deg, rgba(180,205,255,.05) 8deg, transparent 16deg,
          transparent 26deg, rgba(180,205,255,.06) 34deg, transparent 42deg,
          transparent 52deg, rgba(180,205,255,.04) 60deg, transparent 68deg);
      pointer-events: none;
      z-index: 0;
      mask-image: linear-gradient(180deg, #000 0%, transparent 85%);
    }
    .page { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding: 40px 20px 56px; }

    header { text-align: center; }
    .org { color: var(--blue); font-weight: 700; font-size: 13px; letter-spacing: .32em; text-transform: uppercase; margin-bottom: 14px; }
    h1 {
      margin: 0; font-size: clamp(36px, 5vw, 50px); font-weight: 800;
      letter-spacing: -.02em; line-height: .92;
      background: linear-gradient(180deg, #ffffff, #cdd7e6);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .subtitle { margin-top: 16px; color: var(--muted); font-weight: 600; font-size: 15px; letter-spacing: .26em; text-transform: uppercase; }
    .scopebar { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 24px auto 10px; }
    .scope-pill { border: 1px solid var(--card-border); background: rgba(255,255,255,.04); color: var(--muted); border-radius: 99px; padding: 8px 16px; font-size: 13px; font-weight: 700; letter-spacing: .04em; cursor: pointer; font-family: inherit; }
    .scope-pill:hover { color: #fff; }
    .scope-pill.active { background: linear-gradient(90deg, #ffffff, #dbe4f5); color: #0b1020; border-color: transparent; }
    .metricbar { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 0 auto 12px; }
    .metriclabel { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-right: 3px; }
    .scope-pill.mini { padding: 5px 12px; font-size: 12px; letter-spacing: .02em; }
    .daytabs { display: flex; gap: 6px; }
    .daytab { position: relative; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--card-border); background: rgba(255,255,255,.04); color: var(--muted); font-weight: 800; font-size: 14px; cursor: pointer; display: grid; place-items: center; font-family: inherit; }
    .daytab.past { color: #aeb9c9; }
    .daytab.live { color: #fff; border-color: rgba(244,192,79,.45); }
    .daytab.future { opacity: .3; cursor: not-allowed; }
    .daytab.active { background: linear-gradient(180deg, #ffffff, #dbe4f5); color: #0b1020; border-color: transparent; }
    .daytab .dot { position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2px var(--bg-0); animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .progress-label { text-align: center; color: var(--muted-dim); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; margin-bottom: 34px; }

    /* minmax(0,…) locks the column ratio so a long name can't widen its card. */
    .podium { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.18fr) minmax(0,1fr); align-items: end; gap: 14px; margin-bottom: 20px; }
    .pod {
      position: relative; border: 1px solid var(--card-border);
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
      border-radius: 22px; padding: 22px 16px 18px; text-align: center;
    }
    .pod .avatar { width: 74px; height: 74px; border-radius: 50%; margin: 0 auto 14px; display: grid; place-items: center; font-size: 30px; position: relative; }
    .pod .badge {
      position: absolute; top: -4px; right: 50%; transform: translateX(230%);
      width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
      font-size: 13px; font-weight: 800; color: #10151f; border: 2px solid var(--bg-0);
    }
    .pod .name { font-weight: 700; font-size: 15px; line-height: 1.15; margin-bottom: 4px; overflow-wrap: anywhere; }
    .pod .rows { border-top: 1px solid rgba(255,255,255,.07); margin-top: 12px; padding-top: 12px; display: grid; gap: 7px; }
    .pod .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .pod .row .k { color: var(--muted-dim); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
    .pod .row .v { font-weight: 700; font-size: 15px; }

    .pod-1 {
      transform: translateY(-14px); border-color: rgba(244, 192, 79, .55);
      background: linear-gradient(180deg, rgba(244,192,79,.10), rgba(244,192,79,.02));
      box-shadow: 0 0 0 1px rgba(244,192,79,.15), 0 20px 60px -20px rgba(244,192,79,.35);
    }
    .pod-1 .avatar {
      width: 92px; height: 92px; font-size: 40px;
      background: radial-gradient(circle at 50% 35%, #ffe08a, #e6ab3e 60%, #c07f26);
      box-shadow: 0 0 34px rgba(244,192,79,.45);
    }
    .pod-1 .name { font-size: 18px; }
    .pod-1 .badge { background: linear-gradient(180deg,#ffe08a,#e6ab3e); }

    .avatar.gold { background: radial-gradient(circle at 50% 35%, #ffe08a, #e6ab3e 60%, #c07f26); }
    .avatar.silver { background: radial-gradient(circle at 50% 35%, #eef2f8, #b9c3d3 60%, #8b96a8); }
    .avatar.bronze { background: radial-gradient(circle at 50% 35%, #f0b483, #d6884a 60%, #a75f2c); }
    .badge.gold { background: linear-gradient(180deg,#ffe08a,#e6ab3e); }
    .badge.silver { background: linear-gradient(180deg,#eef2f8,#aeb9c9); }
    .badge.bronze { background: linear-gradient(180deg,#f0b483,#c9793d); color:#1a120b; }

    .lead-pill {
      margin-top: 14px; width: 100%; border: 1px solid rgba(244,192,79,.4);
      background: rgba(244,192,79,.08); color: var(--gold);
      border-radius: 12px; padding: 10px 8px; font-weight: 700; font-size: 12.5px;
      letter-spacing: .04em; white-space: nowrap;
      display: flex; gap: 6px; justify-content: center; align-items: center;
    }
    .lead-pill .who { color: #f0e2c0; }

    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .zero { color: var(--muted); }

    /* cards are links to each player's share page — strip default link styling */
    .card-link { display: block; text-decoration: none; color: inherit; -webkit-tap-highlight-color: transparent; }
    .card-link:hover .pod, .card-link:hover .item { border-color: rgba(255, 255, 255, 0.22); }

    /* minmax(0,1fr) caps the row at the container width — without it the implicit
       auto column grows to the item's max-content and the long sub-line overflows. */
    .list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 8px; }
    /* num | (name+tag over sub-line) | big metric — the min-width:0 middle keeps the
       sub-line bounded so it wraps instead of pushing the card past the viewport */
    .item { display: flex; align-items: center; gap: 14px; border: 1px solid var(--card-border); background: var(--card); border-radius: 18px; padding: 16px 20px; }
    .item .num { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 16px; background: rgba(255,255,255,.05); color: var(--muted); }
    .item .main { flex: 1; min-width: 0; }
    .item .who { display: flex; align-items: baseline; gap: 10px; }
    .item .who .nm { min-width: 0; font-weight: 700; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .who .tag { flex: none; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--red); }
    .item .sub { color: var(--muted-dim); font-size: 13px; margin-top: 3px; overflow-wrap: anywhere; }
    .item .big { flex: none; text-align: right; font-weight: 800; font-size: 20px; white-space: nowrap; }
    .item.elim { opacity: .62; }
    .item.elim .num { background: rgba(247,112,102,.10); color: var(--red); font-size: 18px; }

    /* drawdown cushion — room to the trailing end-of-day max-loss limit */
    .dd { margin-top: 12px; }
    .dd-bar { height: 5px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
    .dd-bar > span { display: block; height: 100%; border-radius: 99px; background: var(--green); transition: width .4s ease; }
    .dd.warn .dd-bar > span { background: var(--gold); }
    .dd.danger .dd-bar > span { background: var(--red); }
    .dd-label { margin-top: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
    .dd.warn .dd-label { color: #e7c98a; }
    .dd.danger .dd-label { color: #e79a92; }
    .dd-tag { color: var(--red); font-weight: 800; font-size: 11px; letter-spacing: .1em; }
    .pod.breached { border-color: rgba(247,112,102,.5); background: linear-gradient(180deg, rgba(247,112,102,.09), rgba(247,112,102,.015)); }
    .cu-warn { color: var(--gold); } .cu-danger { color: #e79a92; }

    .rules { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 34px 0 22px; }
    .chip { border: 1px solid var(--card-border); background: rgba(255,255,255,.03); color: #9fb0c6; border-radius: 99px; padding: 11px 18px; font-size: 14px; font-weight: 600; }
    .chip.warn { border-color: rgba(247,112,102,.28); color: #e79a92; }
    footer { text-align: center; color: var(--muted-dim); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; margin-top: 8px; }
    .empty { text-align: center; color: var(--muted); padding: 60px 0; }
    .empty-board { text-align: center; border: 1px dashed var(--card-border); border-radius: 22px; padding: 44px 24px; margin-top: 8px; background: rgba(255,255,255,.015); }
    .empty-board .eb-emoji { font-size: 44px; opacity: .8; }
    .empty-board .eb-title { font-weight: 800; font-size: 20px; margin: 12px 0 6px; }
    .empty-board .eb-sub { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .empty-board .eb-sub code { background: rgba(255,255,255,.06); border-radius: 6px; padding: 2px 6px; font-size: 12.5px; }

    /* ---------- manage panel ---------- */
    .manage-btn {
      position: fixed; top: 16px; right: 16px; z-index: 30;
      border: 1px solid var(--card-border); background: rgba(15,22,38,.7); backdrop-filter: blur(6px);
      color: #b7c4d8; border-radius: 99px; padding: 9px 15px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .manage-btn:hover { color: #fff; border-color: rgba(255,255,255,.2); }
    .overlay { position: fixed; inset: 0; z-index: 40; background: rgba(4,7,14,.72); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; padding: 24px 14px; overflow-y: auto; }
    .overlay.open { display: flex; }
    .panel {
      width: 100%; max-width: 460px; background: #0d1524; border: 1px solid var(--card-border);
      border-radius: 20px; padding: 22px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7);
    }
    .panel h2 { margin: 0 0 4px; font-size: 20px; }
    .panel .hint { color: var(--muted); font-size: 13px; margin: 0 0 18px; line-height: 1.5; }
    .panel .close { float: right; background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; }
    .roster { display: grid; gap: 8px; margin-bottom: 18px; }
    .rrow { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.03); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 12px; }
    .rrow .rn { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rrow .rm { color: var(--muted-dim); font-size: 12px; white-space: nowrap; }
    .rrow .del { background: none; border: none; color: var(--red); cursor: pointer; font-size: 16px; padding: 0 2px; }
    .field { display: grid; gap: 6px; margin-bottom: 10px; }
    .field label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    input[type=text], input[type=number] {
      width: 100%; background: rgba(255,255,255,.04); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 10px 12px; color: var(--ink); font-size: 14px; font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--blue); }
    .checkline { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin: 4px 0 14px; }
    .btn { border: 1px solid var(--card-border); background: rgba(255,255,255,.05); color: var(--ink); border-radius: 11px; padding: 11px 14px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn:hover { border-color: rgba(255,255,255,.2); }
    .btn.primary { background: linear-gradient(180deg, #3f6fd6, #345cc0); border-color: transparent; color: #fff; width: 100%; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .btn-row .btn { flex: 1; }
    .divider { height: 1px; background: var(--card-border); margin: 18px 0; }
    .tools-summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
    .tools-summary:hover { color: var(--ink); }
    /* Discord command list in the Manage panel */
    .cmds { display: grid; gap: 8px; margin: 14px 0 16px; }
    .cmd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 12px; }
    .cmd code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--ink); font-weight: 600; white-space: nowrap; }
    .cmd code .arg { color: var(--muted); font-weight: 500; }
    .cmd-h { color: var(--muted-dim); font-size: 11.5px; text-align: right; }
    a.btn.primary.linkbtn { display: block; text-align: center; text-decoration: none; }

    /* Phones: shrink the 3-up podium so it never overflows a narrow screen. */
    @media (max-width: 560px) {
      .page { padding: 28px 12px 44px; }
      .podium { gap: 7px; }
      .pod { padding: 14px 9px 12px; border-radius: 16px; }
      .pod .avatar { width: 50px; height: 50px; font-size: 21px; margin-bottom: 10px; }
      .pod-1 .avatar { width: 60px; height: 60px; font-size: 26px; }
      .pod .badge { width: 19px; height: 19px; font-size: 10px; transform: translateX(200%); }
      .pod .name { font-size: 12.5px; }
      .pod-1 .name { font-size: 13px; letter-spacing: -0.01em; }
      .pod-1 { transform: translateY(-8px); }
      .pod .rows { gap: 7px; margin-top: 10px; padding-top: 10px; }
      .pod .row { flex-direction: column; align-items: flex-start; gap: 1px; }
      .pod .row .k { font-size: 8.5px; letter-spacing: .07em; }
      .pod .row .v { font-size: 13px; }
      .lead-pill { font-size: 10px; padding: 7px 4px; margin-top: 10px; letter-spacing: 0; }
      .dd { margin-top: 9px; } .dd-label { font-size: 9px; letter-spacing: .02em; } .dd-tag { font-size: 9.5px; }
      .item { padding: 14px 15px; gap: 11px; }
      .item .num { width: 34px; height: 34px; font-size: 15px; }
      .item .who .nm { font-size: 16px; }
      .item .big { font-size: 18px; }
      .item .sub { font-size: 11.5px; }
    }

    /* ---------- winner / celebration view ---------- */
    .celebrate { position: relative; text-align: center; padding: 6px 0 4px; }
    .celebrate .kicker { color: var(--gold); font-weight: 800; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; margin-bottom: 8px; }
    .celebrate .weeklabel { color: var(--muted); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; margin-bottom: 22px; }

    /* the "rotating thingy": a conic halo spins behind a floating trophy */
    .trophy-stage { position: relative; width: 200px; height: 200px; margin: 0 auto 4px; display: grid; place-items: center; }
    .trophy-halo {
      position: absolute; inset: -18px; border-radius: 50%;
      background: conic-gradient(from 0deg,
        transparent 0 18deg, rgba(244,192,79,.55) 40deg, transparent 62deg,
        transparent 92deg, rgba(255,224,138,.32) 112deg, transparent 138deg,
        transparent 198deg, rgba(244,192,79,.48) 220deg, transparent 248deg,
        transparent 318deg, rgba(255,224,138,.26) 340deg, transparent 360deg);
      filter: blur(15px); animation: spin 7s linear infinite;
    }
    .trophy-rays {
      position: absolute; inset: -6px; border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, rgba(244,192,79,.10) 0 6deg, transparent 6deg 18deg);
      mask: radial-gradient(circle, transparent 34%, #000 42%, transparent 74%);
      -webkit-mask: radial-gradient(circle, transparent 34%, #000 42%, transparent 74%);
      animation: spin 26s linear infinite reverse;
    }
    .trophy-ring {
      position: absolute; inset: 10px; border-radius: 50%;
      background: radial-gradient(circle at 50% 42%, rgba(244,192,79,.22), transparent 62%);
      box-shadow: inset 0 0 42px rgba(244,192,79,.28);
    }
    .trophy-emoji { position: relative; font-size: 98px; line-height: 1; filter: drop-shadow(0 12px 30px rgba(244,192,79,.5)); animation: trophy-float 3.6s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes trophy-float { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-9px) rotate(4deg); } }

    .champ-block { display: block; text-decoration: none; color: inherit; -webkit-tap-highlight-color: transparent; }
    .champ-name {
      font-size: clamp(30px, 7vw, 46px); font-weight: 800; letter-spacing: -.02em; line-height: 1; margin: 8px 0 3px;
      background: linear-gradient(180deg, #ffffff, #ffe08a 58%, #e6ab3e);
      -webkit-background-clip: text; background-clip: text; color: transparent; overflow-wrap: anywhere;
    }
    .champ-block:hover .champ-name { filter: brightness(1.08); }
    .champ-sub { color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; margin-bottom: 18px; }

    .champ-stats { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 0 auto 22px; }
    .champ-stat { border: 1px solid rgba(244,192,79,.28); background: rgba(244,192,79,.06); border-radius: 16px; padding: 13px 22px; min-width: 130px; }
    .champ-stat .cv { font-size: 26px; font-weight: 800; }
    .champ-stat .ck { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-top: 4px; }

    .runnersup { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 400px; margin: 0 auto 22px; }
    .ru { border: 1px solid var(--card-border); background: var(--card); border-radius: 16px; padding: 13px 12px; text-align: center; text-decoration: none; color: inherit; }
    .ru:hover { border-color: rgba(255,255,255,.2); }
    .ru .ru-medal { font-size: 19px; }
    .ru .ru-name { font-weight: 700; font-size: 14px; margin: 5px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ru .ru-ret { font-weight: 800; font-size: 16px; }

    .nextweek { color: var(--muted-dim); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; margin-bottom: 18px; }
    .nextweek b { color: var(--ink); font-variant-numeric: tabular-nums; }
    .see-standings { display: inline-block; border: 1px solid var(--card-border); background: rgba(255,255,255,.04); color: #b7c4d8; border-radius: 99px; padding: 10px 20px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; letter-spacing: .02em; }
    .see-standings:hover { color: #fff; border-color: rgba(255,255,255,.22); }
    .winner-return { display: flex; justify-content: center; margin: 0 0 18px; }

    /* confetti burst (one-shot, cleared after it lands) */
    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
    .confetti i { position: absolute; top: -14px; width: 8px; height: 14px; opacity: .9; border-radius: 1px; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(112vh) rotate(720deg); opacity: .15; } }

    @media (prefers-reduced-motion: reduce) {
      .trophy-halo, .trophy-rays, .trophy-emoji { animation: none; }
      .confetti { display: none; }
    }
    @media (max-width: 560px) {
      .trophy-stage { width: 150px; height: 150px; }
      .trophy-emoji { font-size: 72px; }
      .champ-stat { padding: 11px 16px; min-width: 108px; }
      .champ-stat .cv { font-size: 22px; }
    }
  </style>
</head>
<body>
  <button class="manage-btn" id="manageBtn">＋ Join</button>
  <div class="page" id="app"><div class="empty">Loading standings…</div></div>

  <div class="overlay" id="overlay">
    <div class="panel" id="panel"></div>
  </div>

  <script type="module">
    import { fetchWeeklyStats, parseAccountId } from "./src/topstep-api.mjs";
    import { resolveWeek } from "./src/calendar.mjs";
    import { computeMetrics, buildRow, rankByScope, challengeInfo } from "./src/leaderboard.mjs";
    import { fetchBotRoster, mergeRoster, DISCORD_INVITE } from "./src/roster.mjs";

    const $ = (id) => document.getElementById(id);

    /* ---------- formatting ---------- */
    const money = (n, { sign = false } = {}) => {
      if (n == null || !Number.isFinite(Number(n))) return "—";
      const v = Number(n);
      const abs = Math.abs(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (v === 0) return "$" + abs;
      return (v > 0 ? (sign ? "+" : "") : "-") + "$" + abs;
    };
    // Abbreviated account size: 150000 -> "$150k", 175000 -> "$175.5k".
    const sizeShort = (n) => {
      if (!Number.isFinite(Number(n))) return "—";
      const v = Number(n);
      return v >= 1000 ? "$" + +(v / 1000).toFixed(1) + "k" : "$" + v.toLocaleString();
    };
    const pct = (n) => {
      if (n == null || !Number.isFinite(Number(n))) return "—";
      const v = Number(n);
      if (v === 0) return "0.00%";
      const dp = Math.abs(v) < 0.1 ? 3 : 2;
      return (v > 0 ? "+" : "-") + Math.abs(v).toFixed(dp) + "%";
    };
    const cls = (n) => (n > 0 ? "pos" : n < 0 ? "neg" : "zero");
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    /* ---------- render (scope-aware: overall or a single day) ---------- */
    const MEDAL = { 1: "gold", 2: "silver", 3: "bronze" };
    let DATA = null;      // full leaderboard object (rich rows + schedule)
    let SCOPE = "overall"; // "overall" | day number — the time window
    let METRIC = "pct";    // "pct" (% return) | "wpl" (week $) | "today" (today $)

    // Between Friday's CME close and a few hours before Sunday's open, the board
    // flips to a champion celebration. GRACE_MS is how far before the next open we
    // stop celebrating and hand back to the (soon-to-reset) standings.
    const GRACE_MS = 3 * 60 * 60 * 1000;
    let SHOW_BOARD = false; // user clicked "View full standings" — bypass the winner view
    let confettiFired = false;
    // Preview override: ?winner=1 forces the celebration on, ?winner=0 forces it off.
    const WINNER_OVERRIDE = (() => {
      const p = new URLSearchParams(location.search).get("winner");
      return p == null ? null : p === "1" || p === "true";
    })();

    const daysOf = () => (DATA?.schedule?.days || []);
    const dayState = (n) => daysOf().find((d) => d.day === n)?.state;

    function leadWho() {
      if (SCOPE === "overall") return `Day ${DATA?.schedule?.currentDay ?? 0}`;
      return dayState(SCOPE) === "live" ? "Live" : `Day ${SCOPE}`;
    }
    function scopeTitle() {
      const sc = DATA?.schedule || {};
      if (SCOPE === "overall") return `Day ${sc.currentDay ?? 0} of ${sc.totalDays ?? 5} · Standings`;
      const st = dayState(SCOPE);
      return `Day ${SCOPE} · ${st === "live" ? "Live" : st === "future" ? "Upcoming" : "Final"}`;
    }
    function scopeSubtitle(rows) {
      const sc = DATA?.schedule || {};
      if (SCOPE === "overall") return `Day ${sc.currentDay ?? 0} of ${sc.totalDays ?? 5} · ${sc.phase === "done" ? "week complete" : "in progress"}`;
      const d = daysOf().find((x) => x.day === SCOPE);
      if (!d) return "";
      const nice = new Date(d.date + "T12:00:00Z").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      if (d.state === "live") return `${nice} · ${rows.some((r) => r.traded) ? "live · updating" : "live · no trades yet"}`;
      return `${nice} · ${d.state === "future" ? "upcoming" : "final"}`;
    }

    // Wrap a card in a link to the competitor's public share page (opens in a new tab).
    const linked = (inner, url) =>
      url ? `<a class="card-link" href="${esc(url)}" target="_blank" rel="noreferrer">${inner}</a>` : inner;

    // The card leads with whatever we're ranking by (paired with its own %), so the
    // ordering always reads off the top. Every branch returns three rows; podCard
    // appends Account for a consistent four-row card.
    const R = {
      ret:   (r) => `<div class="row"><span class="k">Return</span><span class="v ${cls(r.return_pct)}">${pct(r.return_pct)}</span></div>`,
      wRet:  (r) => `<div class="row"><span class="k">Return</span><span class="v ${cls(r.week_return)}">${pct(r.week_return)}</span></div>`,
      tRet:  (r) => `<div class="row"><span class="k">Return</span><span class="v ${cls(r.today_return)}">${pct(r.today_return)}</span></div>`,
      week:  (r) => `<div class="row"><span class="k">Weekly P&L</span><span class="v ${cls(r.week_pnl)}">${money(r.week_pnl, { sign: true })}</span></div>`,
      today: (r) => `<div class="row"><span class="k">Today P&L</span><span class="v ${cls(r.today_pnl)}">${money(r.today_pnl, { sign: true })}</span></div>`
    };
    const headRows = (row) => {
      if (METRIC === "wpl") return R.week(row) + R.wRet(row) + R.today(row);
      if (METRIC === "today") return R.today(row) + R.tRet(row) + R.week(row);
      return R.ret(row) + R.week(row) + R.today(row);
    };

    // Drawdown cushion: a bar + "$X to limit", or a BREACHED tag (with the day it
    // breached) once intraday equity has touched the trailing max-loss line.
    // Cushion proximity bucket + whole-dollar format, shared by the bar and the note.
    const ddTone = (dd) => { const f = dd.cushion / dd.mll; return f >= 0.5 ? "safe" : f >= 0.2 ? "warn" : "danger"; };
    const dollars0 = (n) => "$" + Math.round(n).toLocaleString();
    // Day of week the account breached, e.g. "Monday" (blank if unknown).
    const ddDay = (dd) => (dd && dd.breach_date ? new Date(dd.breach_date + "T12:00:00Z").toLocaleDateString(undefined, { weekday: "long" }) : "");

    function ddHtml(dd) {
      if (!dd) return "";
      if (dd.breached) {
        const when = ddDay(dd) ? " · " + ddDay(dd) : "";
        return `<div class="dd"><div class="dd-tag">⚠ BREACHED${when}</div></div>`;
      }
      if (dd.cushion == null) return "";
      const frac = Math.max(0, Math.min(1, dd.cushion / dd.mll));
      return `<div class="dd ${ddTone(dd)}">
            <div class="dd-bar"><span style="width:${(frac * 100).toFixed(0)}%"></span></div>
            <div class="dd-label">${dollars0(dd.cushion)} to limit</div>
          </div>`;
    }
    // Compact cushion note for the list sub-line (only tinted once it gets tight).
    function ddCushionSub(dd) {
      if (!dd || dd.cushion == null || dd.breached) return "";
      const c = { safe: "", warn: "cu-warn", danger: "cu-danger" }[ddTone(dd)];
      return ` · <span class="${c}">${dollars0(dd.cushion)} left</span>`;
    }

    function podCard(row, place) {
      const tone = MEDAL[place];
      const lead = place === 1 ? `<div class="lead-pill">LEADING&nbsp; 🔥 <span class="who">${esc(leadWho())}</span></div>` : "";
      return linked(`
        <div class="pod pod-${place}${row.drawdown?.breached ? " breached" : ""}">
          <div class="avatar ${tone}">${place === 1 ? "🏆" : "🤖"}<span class="badge ${tone}">${place}</span></div>
          <div class="name">${esc(row.name)}</div>
          <div class="rows">
            ${headRows(row)}
            <div class="row"><span class="k">Account</span><span class="v" style="color:var(--muted)">${sizeShort(row.account_size)}</span></div>
          </div>${ddHtml(row.drawdown)}${lead}
        </div>`, row.url);
    }
    const listItem = (row) => {
      const breached = !!row.drawdown?.breached;
      const big =
        METRIC === "wpl" ? `<div class="big ${cls(row.week_pnl)}">${money(row.week_pnl, { sign: true })}</div>`
        : METRIC === "today" ? `<div class="big ${cls(row.today_pnl)}">${money(row.today_pnl, { sign: true })}</div>`
        : `<div class="big ${cls(row.return_pct)}">${pct(row.return_pct)}</div>`;
      const tag = breached ? `<span class="tag">BREACHED${ddDay(row.drawdown) ? " · " + ddDay(row.drawdown) : ""}</span>` : "";
      return linked(`
      <div class="item${breached ? " elim" : ""}">
        <div class="num">${row.rank}</div>
        <div class="main">
          <div class="who"><span class="nm">${esc(row.name)}</span>${tag}</div>
          <div class="sub">Wk <span class="${cls(row.week_pnl)}">${money(row.week_pnl, { sign: true })}</span> · Today <span class="${cls(row.today_pnl)}">${money(row.today_pnl, { sign: true })}</span>${ddCushionSub(row.drawdown)}</div>
        </div>
        ${big}
      </div>`, row.url);
    };

    function tabsHtml() {
      const dayTabs = daysOf().map((d) => {
        const active = SCOPE === d.day ? " active" : "";
        const dot = d.state === "live" ? `<span class="dot"></span>` : "";
        return `<button class="daytab ${d.state}${active}" data-scope="${d.day}"${d.state === "future" ? " disabled" : ""}>${d.day}${dot}</button>`;
      }).join("");
      const metricBtn = (m, label, title) =>
        `<button class="scope-pill mini${METRIC === m ? " active" : ""}" data-metric="${m}" title="${title}">${label}</button>`;
      return `<div class="scopebar">
        <button class="scope-pill${SCOPE === "overall" ? " active" : ""}" data-scope="overall">Overall</button>
        <div class="daytabs">${dayTabs}</div>
      </div>
      <div class="metricbar">
        <span class="metriclabel">Rank by</span>
        ${metricBtn("pct", "% Return", "Percent return on account size")}
        ${metricBtn("wpl", "Weekly P&L", "Week-to-date P&amp;L ($)")}
        ${metricBtn("today", "Today P&L", "Today&#39;s P&amp;L ($)")}
      </div>`;
    }

    // ---------- champion celebration (Fri close → ~Sun open) ----------
    // Driven off the live CME clock (not the snapshot) so it self-activates even if
    // the board is served from the fallback JSON. Returns { sched, open } while the
    // window is open, else null.
    function celebrationState() {
      if (WINNER_OVERRIDE === false) return null;
      let sched;
      try { sched = resolveWeek(CONFIG.challenge || {}).schedule; } catch { return null; }
      const open = new Date(sched.weekEnd).getTime();
      const active = WINNER_OVERRIDE === true || (sched.phase === "done" && Date.now() < open - GRACE_MS);
      return active ? { sched, open } : null;
    }
    // "Week of Jul 6 – Jul 10" from the session's Mon..Fri trade dates.
    function weekRangeLabel(sched) {
      const days = sched?.days || [];
      if (!days.length) return "";
      const fmt = (iso) => new Date(iso + "T12:00:00Z").toLocaleDateString(undefined, { month: "short", day: "numeric" });
      return `Week of ${fmt(days[0].date)} – ${fmt(days[days.length - 1].date)}`;
    }
    function nextOpenLabel(open) {
      const ms = open - Date.now();
      if (ms <= 0) return "New week opening…";
      const totalMin = Math.floor(ms / 60000);
      const d = Math.floor(totalMin / 1440), h = Math.floor((totalMin % 1440) / 60), m = totalMin % 60;
      const parts = d ? `${d}d ${h}h` : `${h}h ${m}m`;
      return `Next week opens in <b>${parts}</b>`;
    }

    // One-shot confetti; cleared after the last piece lands so it can't linger.
    function fireConfetti() {
      if (confettiFired || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      confettiFired = true;
      const colors = ["#f4c04f", "#ffe08a", "#7fa9ff", "#ffffff", "#34d399"];
      const N = 90;
      let html = "";
      for (let i = 0; i < N; i++) {
        const left = ((i * 61) % 100);
        const color = colors[i % colors.length];
        const delay = ((i * 53) % 2600) / 1000;
        const dur = 3 + ((i * 17) % 2600) / 1000;
        const w = 6 + (i % 4) * 2;
        html += `<i style="left:${left}%;background:${color};width:${w}px;animation-duration:${dur}s;animation-delay:${delay}s"></i>`;
      }
      const wrap = document.createElement("div");
      wrap.className = "confetti";
      wrap.innerHTML = html;
      document.body.appendChild(wrap);
      setTimeout(() => wrap.remove(), 8500);
    }

    // Render the champion view. Winner = top non-breached account by % return
    // (breached accounts are disqualified). Returns false if there's no valid
    // winner, so draw() can fall back to the normal board.
    function drawWinner(rows, celeb) {
      const ch = DATA.challenge || {};
      const ranked = rankByScope(rows, "overall", celeb.sched.currentDay ?? 0, "pct");
      // A champion must have actually competed — non-breached AND traded this week.
      // A just-joined account with no data (0.00%) isn't a winner.
      const survivors = ranked.filter((r) => !r.drawdown?.breached && (r.days_traded ?? 0) > 0 && Number.isFinite(Number(r.return_pct)));
      const win = survivors[0];
      if (!win) return false;
      const runners = survivors.slice(1, 3);
      const medal = ["🥈", "🥉"];
      // Wrap in a link to the competitor's share page when we have one, else a plain
      // div so the card styling always applies.
      const wrap = (cls, url, inner) =>
        url ? `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noreferrer">${inner}</a>` : `<div class="${cls}">${inner}</div>`;

      $("app").innerHTML = `
        <header>
          <div class="org">🤖 ${esc(ch.org || "Algo Traderz")}</div>
          <h1>${esc((ch.title || "Bot Challenge")).toUpperCase()}</h1>
        </header>
        <section class="celebrate">
          <div class="kicker">🏆 Champion of the Week</div>
          <div class="weeklabel">${esc(weekRangeLabel(celeb.sched))}</div>
          ${wrap("champ-block", win.url, `
            <div class="trophy-stage">
              <div class="trophy-halo"></div>
              <div class="trophy-rays"></div>
              <div class="trophy-ring"></div>
              <div class="trophy-emoji">🏆</div>
            </div>
            <div class="champ-name">${esc(win.name)}</div>
            <div class="champ-sub">${sizeShort(win.account_size)} account</div>`)}
          <div class="champ-stats">
            <div class="champ-stat"><div class="cv ${cls(win.return_pct)}">${pct(win.return_pct)}</div><div class="ck">Return</div></div>
            <div class="champ-stat"><div class="cv ${cls(win.week_pnl)}">${money(win.week_pnl, { sign: true })}</div><div class="ck">Weekly P&L</div></div>
          </div>
          ${runners.length ? `<div class="runnersup">${runners.map((r, i) => wrap("ru", r.url, `
            <div class="ru-medal">${medal[i]}</div>
            <div class="ru-name">${esc(r.name)}</div>
            <div class="ru-ret ${cls(r.return_pct)}">${pct(r.return_pct)}</div>`)).join("")}</div>` : ""}
          <div class="nextweek">${nextOpenLabel(celeb.open)}</div>
          <button class="see-standings" id="seeStandings">View full standings →</button>
        </section>
        <footer>Final standings · Week complete</footer>`;

      $("seeStandings").onclick = () => { SHOW_BOARD = true; draw(); };
      fireConfetti();
      return true;
    }

    function draw() {
      if (!DATA) return;
      const celeb = celebrationState();
      if (celeb && !SHOW_BOARD && drawWinner(DATA.rows || [], celeb)) return;
      const ch = DATA.challenge || {};
      const rows = rankByScope(DATA.rows || [], SCOPE, DATA.schedule?.currentDay ?? 0, METRIC);
      const podium = rows.slice(0, 3);
      const rest = rows.slice(3);
      const order = [podium[2], podium[0], podium[1]];
      const placeOf = [3, 1, 2];
      // Champion-eligible = actually competed this week (non-breached AND traded). When
      // nobody qualifies during the completed-week window (e.g. a reset weekend where the
      // only entrants just joined with no data), show the invite/wait card instead of a
      // hollow 0.00% podium.
      const eligible = rows.filter((r) => !r.drawdown?.breached && (r.days_traded ?? 0) > 0 && Number.isFinite(Number(r.return_pct)));
      const showInvite = rows.length === 0 || (!!celeb && eligible.length === 0);
      const inviteCard = `<section class="empty-board">
          <div class="eb-emoji">${rows.length ? "🏁" : "🤖"}</div>
          <div class="eb-title">${rows.length ? "No results in yet" : "No bots on the board yet"}</div>
          <div class="eb-sub">${rows.length
            ? "The board resets each week — a new week opens soon. Lock in your account with <code>/join</code>."
            : "Be the first — run <code>/join &lt;your TopstepX share link&gt;</code> in Discord."}</div>
          <a class="btn primary linkbtn" href="${esc(DISCORD_INVITE)}" target="_blank" rel="noreferrer" style="max-width:260px;margin:18px auto 0;">Open Discord →</a>
        </section>`;
      const rules = (ch.rules || []).map((r, i) => `<div class="chip${i > 0 ? " warn" : ""}">${esc(r)}</div>`).join("");
      const updated = DATA.generated_at
        ? new Date(DATA.generated_at).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })
        : "";
      // Only when the user actively left an existing winner view (SHOW_BOARD) — not when
      // the board is showing because there's no champion (empty roster / all breached).
      const backBar = (celeb && SHOW_BOARD) ? `<div class="winner-return"><button class="see-standings" id="backWinner">🏆 Back to winner</button></div>` : "";

      $("app").innerHTML = `
        <header>
          <div class="org">🤖 ${esc(ch.org || "Algo Traderz")}</div>
          <h1>${esc((ch.title || "Bot Challenge")).toUpperCase()}</h1>
          <div class="subtitle">${esc(scopeTitle())}</div>
          ${tabsHtml()}
          <div class="progress-label">${esc(scopeSubtitle(rows))}</div>
        </header>
        ${backBar}
        ${showInvite ? inviteCard : ""}
        ${!showInvite && podium.length ? `<section class="podium">${order.map((r, i) => (r ? podCard(r, placeOf[i]) : `<div class="pod" style="visibility:hidden"></div>`)).join("")}</section>` : ""}
        ${!showInvite && rest.length ? `<section class="list">${rest.map(listItem).join("")}</section>` : ""}
        ${rules ? `<section class="rules">${rules}</section>` : ""}
        <footer>Last updated · ${esc(updated)}</footer>`;

      $("app").querySelectorAll("[data-scope]").forEach((b) => {
        if (b.disabled) return;
        b.onclick = () => { SCOPE = b.dataset.scope === "overall" ? "overall" : Number(b.dataset.scope); draw(); };
      });
      $("app").querySelectorAll("[data-metric]").forEach((b) => {
        b.onclick = () => { METRIC = b.dataset.metric; draw(); };
      });
      const bw = $("backWinner"); if (bw) bw.onclick = () => { SHOW_BOARD = false; draw(); };
    }
    const showEmpty = (msg) => { $("app").innerHTML = `<div class="empty">${msg || "No standings yet."}</div>`; };

    /* ---------- roster: participants.json (seed) + Discord bot (self-serve) ---------- */
    let CONFIG = { challenge: {}, participants: [] };

    async function loadRoster() {
      let challenge = {};
      let base = [];
      try {
        const res = await fetch("./participants.json", { cache: "no-store" });
        if (res.ok) {
          const j = await res.json();
          challenge = Array.isArray(j) ? {} : j.challenge ?? {};
          base = Array.isArray(j) ? j : j.participants ?? [];
        }
      } catch {}
      const extra = await fetchBotRoster(); // players who ran /join in Discord
      return { challenge, participants: mergeRoster(base, extra) };
    }

    /* ---------- build the board live from config (with snapshot fallback) ---------- */
    async function buildLive(config) {
      const ch = config.challenge || {};
      const { schedule, range } = resolveWeek(ch);
      const rows = (await Promise.all((config.participants || []).map(async (p) => {
        const accountId = parseAccountId(p.accountId ?? p.share ?? p.url);
        if (accountId == null) return null;
        try {
          const metrics = computeMetrics(await fetchWeeklyStats(accountId, range), schedule.days, { currentDay: schedule.currentDay });
          return buildRow(p, accountId, metrics, { source: "live" });
        } catch {
          return buildRow(p, accountId, {}, { source: "error" });
        }
      }))).filter(Boolean);
      return {
        generated_at: new Date().toISOString(),
        week: { start: schedule.weekStart, end: schedule.weekEnd },
        schedule: { currentDay: schedule.currentDay, totalDays: schedule.totalDays, phase: schedule.phase, days: schedule.days },
        challenge: challengeInfo(ch),
        rows
      };
    }

    async function refresh() {
      try {
        CONFIG = await loadRoster(); // pick up newly self-added players each cycle
        // An empty roster is a valid state now (fresh week, nobody's joined yet) — build
        // it live so the board shows the invite empty-state, not a stale snapshot.
        DATA = await buildLive(CONFIG);
        draw();
      } catch (e) {
        try { DATA = await (await fetch("./data/leaderboard.json", { cache: "no-store" })).json(); draw(); }
        catch { showEmpty("No standings yet. Join in Discord with <code>/join</code> — see the ＋ Join button."); }
      }
    }

    /* ---------- manage panel (read-only; managing your link happens in Discord) ---------- */
    function renderPanel() {
      const ps = CONFIG.participants || [];
      const rosterHtml = ps.length ? ps.map((p) => {
        const acc = parseAccountId(p.accountId ?? p.share ?? p.url);
        return `<div class="rrow">
          <span class="rn">${esc(p.name || p.discord || "—")}</span>
          <span class="rm">${acc != null ? "account " + acc : "no link"}</span>
        </div>`;
      }).join("") : `<div class="hint">No one's joined yet — be first with <code>/join</code>.</div>`;

      $("panel").innerHTML = `
        <button class="close" id="closeBtn">×</button>
        <h2>Manage your link in Discord</h2>
        <p class="hint">Your entry is tied to your Discord account — no login, and it works from any device. In the server, just run:</p>
        <div class="cmds">
          <div class="cmd"><code>/join <span class="arg">&lt;your TopstepX share link&gt;</span></code><span class="cmd-h">join, or update your link</span></div>
          <div class="cmd"><code>/link <span class="arg">&lt;new link&gt;</span></code><span class="cmd-h">swap accounts mid-week</span></div>
          <div class="cmd"><code>/mylink</code><span class="cmd-h">see what's on file</span></div>
          <div class="cmd"><code>/leave</code><span class="cmd-h">drop out</span></div>
        </div>
        <a class="btn primary linkbtn" href="${esc(DISCORD_INVITE)}" target="_blank" rel="noreferrer">Open Discord →</a>
        <p class="hint" style="margin-top:14px;">Your account size, P&amp;L and % return are read live from your public share link — turn on <b>Share</b> on your TopstepX stats page so the bot can see it.</p>

        <div class="divider"></div>
        <h2 style="font-size:16px; margin-bottom:10px;">On the board now · ${ps.length}</h2>
        <div class="roster">${rosterHtml}</div>`;

      $("closeBtn").onclick = closePanel;
    }

    function openPanel() {
      renderPanel();
      $("overlay").classList.add("open");
    }
    const closePanel = () => $("overlay").classList.remove("open");

    $("manageBtn").onclick = openPanel;
    $("overlay").onclick = (e) => { if (e.target === $("overlay")) closePanel(); };

    /* ---------- init ---------- */
    let refreshTimer = null;
    async function init() {
      await refresh(); // loads roster (participants.json + Discord bot) and builds the board
      // Keep the current (unfinished) day's P&L — and any new self-added players — in motion.
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(refresh, 60000);
    }
    init();
  </script>
